[workspace]
resolver = "3"
members = ["snake-classic"]

[workspace.dependencies]
bevy = "0.20.0"
rand = "0.10.3"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 0

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
